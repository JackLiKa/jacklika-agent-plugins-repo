name: NPM install smoke test (cross-platform)

# Verifies that @jacklika/dsh-memory can be installed from the npm registry
# into a fresh DeepSeek Harness profile on Linux, macOS, and Windows.
# This is the primary cross-platform "plugin introduction" path for end users.

on:
  workflow_dispatch:
    inputs:
      bundle_version:
        description: '@jacklika/dsh-memory version to test (required for manual runs)'
        required: true
      dsh_version:
        description: '@deepseek-ai/dsh runtime version to install'
        required: true
        default: '0.2.0-rc.1'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DSH_HOME: /tmp/dsh-smoke/.dsh
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve Bundle version
        id: bundle_version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REQUESTED_VERSION: ${{ inputs.bundle_version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = 'release' ]; then
            if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "invalid release tag: $RELEASE_TAG"
              exit 1
            fi
            version="${RELEASE_TAG#v}"
          else
            version="$REQUESTED_VERSION"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "invalid bundle version: $version"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Testing @jacklika/dsh-memory@$version"

      - name: Create isolated profile
        shell: bash
        run: |
          mkdir -p /tmp/dsh-smoke
          cd /tmp/dsh-smoke
          pnpm init

          # 0.2.0-rc.1 is a fresh pre-release; allow it for this smoke test.
          cat > .npmrc <<EOF
          minimum-release-age=0
          ignore-build-scripts=true
          EOF

          # Match the allowBuilds policy used by the local profile test.
          cat > pnpm-workspace.yaml <<'EOF'
          autoInstallPeers: true
          allowBuilds:
            '@deepseek-ai/dsh-subprocess-local': true
            '@google/genai': false
            koffi: true
            node-pty: true
            protobufjs: false
          EOF

      - name: Install DeepSeek Harness runtime
        shell: bash
        env:
          DSH_VERSION: ${{ inputs.dsh_version || '0.2.0-rc.1' }}
        run: |
          cd /tmp/dsh-smoke
          pnpm add "@deepseek-ai/dsh@$DSH_VERSION"

      - name: Initialize profile
        shell: bash
        run: |
          cd /tmp/dsh-smoke
          pnpm exec dsh plugin --profile smoke root

      - name: Wait for npm release visibility
        if: github.event_name == 'release'
        shell: bash
        env:
          BUNDLE_VERSION: ${{ steps.bundle_version.outputs.version }}
        run: |
          for attempt in {1..48}; do
            if npm view "@jacklika/dsh-memory@$BUNDLE_VERSION" version --prefer-online --fetch-retries=0 > /dev/null 2>&1; then
              echo "@jacklika/dsh-memory@$BUNDLE_VERSION is available from npm"
              break
            fi
            if [ "$attempt" -eq 48 ]; then
              echo "@jacklika/dsh-memory@$BUNDLE_VERSION did not become available"
              exit 1
            fi
            sleep 10
          done

      - name: Install Bundle from npm
        shell: bash
        env:
          BUNDLE_VERSION: ${{ steps.bundle_version.outputs.version }}
        run: |
          cd /tmp/dsh-smoke
          pnpm exec dsh plugin --profile smoke add "@jacklika/dsh-memory@$BUNDLE_VERSION"

      - name: Verify installed Bundle version
        shell: bash
        env:
          BUNDLE_VERSION: ${{ steps.bundle_version.outputs.version }}
        run: |
          cd /tmp/dsh-smoke/.dsh/profiles/smoke
          installed="$(node -p "require('./node_modules/@jacklika/dsh-memory/package.json').version")"
          if [ "$installed" != "$BUNDLE_VERSION" ]; then
            echo "expected @jacklika/dsh-memory@$BUNDLE_VERSION, installed $installed"
            exit 1
          fi
          echo "Verified @jacklika/dsh-memory@$installed in the smoke profile"

      - name: Verify profile dump-config
        shell: bash
        run: |
          cd /tmp/dsh-smoke
          pnpm exec dsh --profile smoke --dump-config > /tmp/dump-config.yml
          for id in memory-scope memory-queue memory-git memory-curator tool-memory-filesystem tool-memory-graph; do
            grep -q "id: $id" /tmp/dump-config.yml || (echo "missing $id" && exit 1)
          done
          grep -q "id: tool-memory-vector" /tmp/dump-config.yml || (echo "missing tool-memory-vector" && exit 1)
          grep -A3 "id: tool-memory-vector" /tmp/dump-config.yml | grep -q "disabled: true" || (echo "tool-memory-vector should be disabled by default" && exit 1)
          if grep -qi "incompatible" /tmp/dump-config.yml; then
            echo "compatibility warning found"
            exit 1
          fi
          echo "Cross-platform npm smoke test passed on ${{ matrix.os }}"
