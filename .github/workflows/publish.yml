name: Publish to npm

# Publishes the workspace packages to the npm registry from pre-built tarballs,
# and maintains npm dist-tags via OIDC once trusted publishing is validated.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Publish packages or maintain dist-tags'
        type: choice
        options: [publish, dist-tag]
        default: 'publish'
      dry_run:
        description: 'Run npm publish --dry-run instead of publishing'
        type: boolean
        default: true
      tag:
        description: 'npm dist-tag to apply when publishing'
        type: string
        default: 'latest'
      dist_tag_action:
        description: 'dist-tag action (only for action=dist-tag)'
        type: choice
        options: [rm, add]
        default: 'rm'
      dist_tag:
        description: 'dist-tag name (only for action=dist-tag)'
        type: string
        default: 'next'
      dist_tag_version:
        description: 'version for dist-tag add (ignored for rm)'
        type: string
        default: ''
      dist_tag_packages:
        description: 'packages for dist-tag action; empty uses the memory suite'
        type: string
        default: ''
  release:
    types: [published]

permissions:
  contents: read
  # Trusted publishing: OIDC is used when NODE_AUTH_TOKEN is not present.
  id-token: write

jobs:
  publish:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.action == 'publish')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Produce and verify tarballs
        run: |
          pnpm pack:all
          pnpm test:pack

      # Publish in dependency order: tools -> memory primitives -> Bundle.
      # Tarball glob ordering matters; the Bundle tarball is matched last by
      # requiring the version to start with a digit.
      - name: Publish packages
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Auth order: trusted publishing (OIDC) first, token fallback second.
          # With both ACTIONS_ID_TOKEN_REQUEST_URL and NODE_AUTH_TOKEN present npm
          # ignores the OIDC route, so the token is withheld until a publish
          # actually fails on authentication. Once every package's trusted
          # publisher is configured and proven, NPM_TOKEN can be dropped for good.
          unset NODE_AUTH_TOKEN
          dry_run=''
          if [ '${{ github.event.inputs.dry_run || 'false' }}' = 'true' ]; then
            dry_run='--dry-run'
          fi
          tag='${{ github.event.inputs.tag || 'latest' }}'

          publish() {
            for tgz in "$@"; do
              # Read name and version from the tarball package.json.
              meta=$(tar -xzf "$tgz" package/package.json -O | node -e "let d=''; process.stdin.on('data', c => d += c).on('end', () => { const p = JSON.parse(d); console.log(p.name + ' ' + p.version); })")
              name=$(echo "$meta" | cut -d' ' -f1)
              version=$(echo "$meta" | cut -d' ' -f2)
              if [ -n "$dry_run" ]; then
                echo "[dry-run] $name@$version"
                npm publish --access public --tag "$tag" $dry_run "$tgz"
                continue
              fi
              attempt_publish() {
                if npm publish --access public --tag "$tag" "$tgz" >npm_publish.log 2>&1; then
                  return 0
                fi
                publish_status=$?
                # npm may return E403/E409 if the version was published but
                # not yet visible to npm view due to registry propagation.
                # If the error message explicitly says the version already
                # exists, trust it and move on; otherwise retry npm view for up
                # to two minutes before failing the job.
                if grep -qiE 'previously published|already exists|Cannot publish over' npm_publish.log; then
                  echo "$name@$version already published (per npm error message)"
                  return 0
                fi
                cat npm_publish.log
                for _ in $(seq 1 12); do
                  if npm view "$name@$version" version >/dev/null 2>&1; then
                    echo "$name@$version already published (confirmed after E403/E409)"
                    return 0
                  fi
                  sleep 10
                done
                return "$publish_status"
              }

              if npm view "$name@$version" version >/dev/null 2>&1; then
                echo "$name@$version already published"
              else
                echo "Publishing $name@$version"
                if attempt_publish; then
                  : # published successfully
                else
                  # The OIDC attempt failed; retry once with the repository
                  # token, which stays valid for publishing until January 2027.
                  echo "OIDC publish of $name@$version failed; retrying with NPM_TOKEN"
                  npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
                  attempt_publish || exit "$?"
                fi
              fi
              echo "Published $name@$version with tag $tag"
              # npm publish --tag already sets the dist-tag; skip a separate
              # dist-tag add to avoid transient 404s on brand-new scoped packages.
              # Visibility is granted by --access public on the publish command;
              # a separate npm access call is refused for bypass-2FA tokens and
              # only produces a 403 warning, so none is attempted.
            done
          }

          cd artifacts/packages
          # Independent LLM provider adapters: they share no code with the memory
          # chain, so their position here carries no ordering constraint.
          publish jacklika-dsh-devin-bridge-*.tgz
          publish jacklika-dsh-llm-qoder-*.tgz
          publish jacklika-dsh-memory-time-*.tgz
          publish jacklika-dsh-tool-memory-filesystem-*.tgz
          publish jacklika-dsh-tool-memory-vector-*.tgz
          publish jacklika-dsh-tool-memory-graph-*.tgz
          publish jacklika-dsh-memory-scope-*.tgz
          publish jacklika-dsh-memory-queue-*.tgz
          publish jacklika-dsh-memory-git-*.tgz
          publish jacklika-dsh-memory-mcp-*.tgz
          publish jacklika-dsh-memory-curator-*.tgz
          publish jacklika-dsh-todo-anchor-*.tgz
          publish jacklika-dsh-memory-anchor-*.tgz
          publish jacklika-dsh-memory-[0-9]*.tgz

  dist-tags:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'dist-tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply dist-tag change
        env:
          # Token fallback for the default path. OIDC mode unsets this variable
          # so npm uses the OIDC token from the runner.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Use OIDC trusted publishing; npm picks up the runner's OIDC token
          # when NODE_AUTH_TOKEN is absent.
          unset NODE_AUTH_TOKEN

          if [ '${{ inputs.dist_tag_action }}' = 'add' ] && [ -z '${{ inputs.dist_tag_version }}' ]; then
            echo 'dist_tag_version is required for action=add'
            exit 1
          fi
          action='${{ inputs.dist_tag_action }}'
          tag='${{ inputs.dist_tag }}'
          version='${{ inputs.dist_tag_version }}'
          packages='${{ inputs.dist_tag_packages }}'
          if [ -z "$packages" ]; then
            packages='@jacklika/dsh-memory @jacklika/dsh-tool-memory-filesystem @jacklika/dsh-memory-curator @jacklika/dsh-tool-memory-graph @jacklika/dsh-memory-mcp'
          fi
          failed=0
          for entry in $packages; do
            if [ "$action" = 'rm' ]; then
              target="$entry"
            else
              target="$entry@$version"
            fi
            echo "npm dist-tag $action $target $tag"
            if output=$(npm dist-tag "$action" "$target" "$tag" 2>&1); then
              echo "$output"
            else
              # Re-running a cleanup must not fail on an already-absent tag.
              if echo "$output" | grep -qi 'no such dist-tag\|E404'; then
                echo "skipped: $entry has no '$tag' dist-tag"
              else
                echo "$output"
                failed=1
              fi
            fi
          done
          exit "$failed"
