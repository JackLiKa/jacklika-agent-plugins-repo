# The dsh-memory bundle patch: the Obsidian-compatible memory vault and its
# write ladder over dsh-base. Insert order is the waterfall order — each
# earlier plugin wraps the dispatches of the ones after it:
# scope rewrites private write ids into agents/<key>/ namespaces, queue
# serializes the surviving same-lane writes across processes, git commits
# shared/ writes inside the lock, and the filesystem tool owns the vault
# itself. Reads stay unscoped: every agent can read the whole vault.
- insert:
    - id: memory-scope
      name: '@jacklika/dsh-memory-scope'

    - id: memory-queue
      name: '@jacklika/dsh-memory-queue'
      config:
        vaultRoot: '.plugins/memory'
        crossProcessLock: true
        laneArgument: id

    - id: memory-git
      name: '@jacklika/dsh-memory-git'
      config:
        vaultRoot: '.plugins/memory'
        prefixes: ['shared/']
        nestedRepo: init

    - id: tool-memory-filesystem
      name: '@jacklika/dsh-tool-memory-filesystem'
      config:
        vaultRoot: '.plugins/memory'
        extensions: ['.md']
        maxLinkDepth: 1
        maxSearchResults: 20
        indexHiddenDirs: false

    - id: memory-curator
      name: '@jacklika/dsh-memory-curator'

    - id: tool-memory-graph
      name: '@jacklika/dsh-tool-memory-graph'
      config:
        vaultRoot: '.plugins/memory'

    # Semantic search stays off until a deployment supplies an embeddings
    # endpoint; enable it from the profile patch layer:
    #   - id: tool-memory-vector
    #     disabled: false
    #     config:
    #       vaultRoot: '.plugins/memory'
    #       endpoint: http://localhost:11434/v1/embeddings
    #       model: nomic-embed-text
    - id: tool-memory-vector
      name: '@jacklika/dsh-tool-memory-vector'
      disabled: true
      config:
        vaultRoot: '.plugins/memory'
